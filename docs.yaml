                "status": { "type": "integer" },
                "msg": { "type": "string" },
                "data":
                  {
                    "type": "object",
                    "properties":
                      {
                        "acknowledged": { "type": "boolean" },
                        "deletedCount": { "type": "integer" },
                      },
                    "required": ["acknowledged", "deletedCount"],
