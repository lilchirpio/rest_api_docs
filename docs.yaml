      consumes:
        - "application/json"
      produces:
        - "application/json"

      parameters:
        - in: header
          name: Authorization
          type: string
          required: true
          description: API Key
        - in: header
          name: dburl
          type: string
          required: true
          description: unique key which you will be receiving in the login API, under account section with the name of accountUrl
        - in: body
          name: body
          description: payload
          required: true
          schema:
            $ref: "#/definitions/createProject"

      responses:
        "200":
          description: Success
          schema:
            "type": "object"
            "properties":
              {
                "status": { "type": "integer" },
                "msg": { "type": "string" },
                "data":
                  {
                    "type": "object",
                    "properties": { "projectId": { "type": "string" } },
