        "200":
          description: Success
          schema:
            "type": "object"
            "properties":
              {
                "status": { "type": "integer" },
                "data":
                  {
                    "type": "array",
                    "items":
                      [
                        {
                          "type": "object",
                          "properties":
                            {
                              "_id": { "type": "string" },
                              "projectName": { "type": "string" },
                              "projectKey": { "type": "null" },
                              "botPlatform": { "type": "string" },
                              "accountId": { "type": "null" },
